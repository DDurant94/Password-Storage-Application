swagger: "2.0"
info:
  title: Password Keeper
  version: 1.0.0
  description: >-
    API for managing users, roles, folders, passwords, password history, audit logs,
    and security questions. 
    

    All protected endpoints require a bearer token in the Authorization header. Use the "/user/login" endpoint to obtain a token, then include it as "Bearer <token>" for authenticated requests.


    How to use this API:
      1. Create a user with /user/.
      2. Sign in with /user/login to receive an auth token.
      3. Copy the token and add it to the Authorization header as "Bearer <token>".
      4. Call protected endpoints such as /folder/, /password/, /roles/, or /security/.
      5. If your token expires, use /user/refresh with a refresh token to obtain a new one.

host: 127.0.0.1:5000
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
responses:
  BadRequestError:
    description: Malformed JSON or an invalid request body. The API may return a validation object for schema problems.
    schema:
      $ref: '#/definitions/Error'
  UnauthorizedError:
    description: Missing, expired, or invalid bearer token.
    schema:
      $ref: '#/definitions/Error'
  ForbiddenError:
    description: User is authenticated but lacks the required role.
    schema:
      $ref: '#/definitions/Error'
  NotFoundError:
    description: Requested resource was not found.
    schema:
      $ref: '#/definitions/Error'
  ConflictError:
    description: The request conflicts with an existing resource or current state.
    schema:
      $ref: '#/definitions/Error'
  UnprocessableEntityError:
    description: Business rule validation failed. The response uses the standard error envelope with error_code and details.
    schema:
      $ref: '#/definitions/Error'
  ServerError:
    description: The server encountered an unexpected error while processing the request.
    schema:
      $ref: '#/definitions/Error'
paths:
  /user/:
    post:
      tags: [Users]
      summary: Create a user
      description: Creates a new user account. Use this endpoint to register a new user before authenticating.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UserCredentials'
      responses:
        '201':
          description: User created
          schema:
            $ref: '#/definitions/User'
          examples:
            application/json:
              user_id: 1
              username: demoUser
              first_name: Demo
              last_name: User
              email: demo@example.com
              role: user
        '400':
          $ref: '#/responses/BadRequestError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    get:
      tags: [Users]
      summary: Get the current user
      description: Returns the authenticated user profile. This endpoint requires a valid bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile returned
          schema:
            $ref: '#/definitions/User'
        '401':
          $ref: '#/responses/UnauthorizedError'
    put:
      tags: [Users]
      summary: Update the current user
      description: Updates the authenticated user's profile. Send the full updated user payload in the request body.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/User'
      responses:
        '201':
          description: User updated
          schema:
            $ref: '#/definitions/User'
        '400':
          $ref: '#/responses/BadRequestError'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '500':
          $ref: '#/responses/ServerError'
    delete:
      tags: [Users]
      summary: Delete the current user
      description: Deletes the authenticated user account.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '500':
          $ref: '#/responses/ServerError'

  /user/login:
    post:
      tags: [Users]
      summary: Authenticate a user
      description: Authenticates a user and returns an auth token. Use the returned token in the Authorization header for protected endpoints.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/LoginCredentials'
      responses:
        '200':
          description: Login successful
          schema:
            $ref: '#/definitions/LoginResponse'
          examples:
            application/json:
              status: success
              message: Successfully logged in
              auth_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh
        '422':
          $ref: '#/responses/UnprocessableEntityError'

  /user/refresh:
    post:
      tags: [Users]
      summary: Refresh an auth token
      description: Returns a refreshed token for the current session using a valid refresh token.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          $ref: '#/responses/BadRequestError'

  /user/logout:
    post:
      tags: [Users]
      summary: Revoke a refresh token
      description: Revokes the supplied refresh token.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/RefreshTokenRequest'
      responses:
        '200':
          description: Token revoked
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'

  /user/logout-all:
    post:
      tags: [Users]
      summary: Revoke all refresh tokens
      description: Revokes all refresh tokens for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All tokens revoked
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'

  /roles/:
    get:
      tags: [Roles]
      summary: List roles
      description: Returns all available roles. This endpoint is typically used by administrators and other privileged clients.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles returned
          schema:
            type: array
            items:
              $ref: '#/definitions/Role'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '403':
          $ref: '#/responses/ForbiddenError'
    post:
      tags: [Roles]
      summary: Create a role
      description: Creates a new role. Admin access is required for this operation.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/RoleCredentials'
      responses:
        '201':
          description: Role created
          schema:
            $ref: '#/definitions/Role'
        '400':
          $ref: '#/responses/BadRequestError'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '403':
          $ref: '#/responses/ForbiddenError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    put:
      tags: [Roles]
      summary: Update a role
      description: Updates an existing role and propagates the role change to the affected users.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Role'
      responses:
        '201':
          description: Role updated
          schema:
            $ref: '#/definitions/Role'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '403':
          $ref: '#/responses/ForbiddenError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          $ref: '#/responses/ConflictError'
        '500':
          $ref: '#/responses/ServerError'
    delete:
      tags: [Roles]
      summary: Delete a role
      description: Deletes a role that is not protected. Admin access is required, and protected roles cannot be removed.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Role'
      responses:
        '200':
          description: Role deleted
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '403':
          $ref: '#/responses/ForbiddenError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'

  /folder/:
    post:
      tags: [Folders]
      summary: Create a folder
      description: Creates a folder for the authenticated user. Use parent_folder_id to nest the folder under another folder, or leave it null for a top-level folder.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/FolderCredentials'
      responses:
        '201':
          description: Folder created
          schema:
            $ref: '#/definitions/Folder'
        '400':
          $ref: '#/responses/BadRequestError'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    get:
      tags: [Folders]
      summary: List folders
      description: Returns all folders for the authenticated user, including their parent-child relationships.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Folders returned
          schema:
            type: array
            items:
              $ref: '#/definitions/Folder'
        '401':
          $ref: '#/responses/UnauthorizedError'
    put:
      tags: [Folders]
      summary: Update a folder
      description: Updates an existing folder for the authenticated user. Use this to rename a folder or change its parent relationship.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Folder'
      responses:
        '201':
          description: Folder updated
          schema:
            $ref: '#/definitions/Folder'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    delete:
      tags: [Folders]
      summary: Delete a folder
      description: >-
        Deletes a folder for the authenticated user. Child folders are reparented to the deleted folder's parent
        or become top-level folders if no parent exists. Passwords in the deleted folder are detached and keep their
        record rather than being deleted.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Folder'
      responses:
        '200':
          description: Folder deleted
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'

  /password/:
    post:
      tags: [Passwords]
      summary: Create a password
      description: Stores a new password entry for the authenticated user. The payload includes the credential details and optional folder assignment.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/PasswordCredentials'
      responses:
        '201':
          description: Password created
          schema:
            $ref: '#/definitions/Password'
          examples:
            application/json:
              password_id: 42
              folder_id: 10
              user_id: 1
              password_name: GitHub
              username: demoUser
              email: demo@example.com
              encripted_password: 8f9a6d2c4e7b1a3d
        '401':
          $ref: '#/responses/UnauthorizedError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    get:
      tags: [Passwords]
      summary: List passwords
      description: >-
        Returns password entries for the authenticated user, including any folder association.
        Use the optional query parameters limit and offset to page through results.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          description: Maximum number of password records to return. The server caps this at 100.
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          description: Number of password records to skip before returning the next page.
      responses:
        '200':
          description: Passwords returned
          schema:
            type: array
            items:
              $ref: '#/definitions/Password'
          examples:
            application/json:
              - password_id: 42
                folder_id: 10
                user_id: 1
                password_name: GitHub
                username: demoUser
                email: demo@example.com
                encripted_password: 8f9a6d2c4e7b1a3d
              - password_id: 43
                folder_id: 11
                user_id: 1
                password_name: Azure
                username: demoUser
                email: demo@example.com
                encripted_password: 1a2b3c4d5e6f7g8h
        '401':
          $ref: '#/responses/UnauthorizedError'
    put:
      tags: [Passwords]
      summary: Update a password
      description: Updates an existing password record for the authenticated user. This also updates the password history trail for the entry.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Password'
      responses:
        '201':
          description: Password updated
          schema:
            $ref: '#/definitions/Password'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    delete:
      tags: [Passwords]
      summary: Delete a password
      description: Deletes a password record for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Password'
      responses:
        '200':
          description: Password deleted
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'

  /password/search=<string:name>:
    get:
      tags: [Passwords]
      summary: Find a password by name
      description: Searches for a single password entry by its supplied name. Use this when you already know the password label.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          description: Maximum number of matching history records to return when the search is expanded. The server caps this at 100.
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          description: Number of matching history records to skip before returning the next page.
        - name: name
          in: path
          required: true
          type: string
      responses:
        '200':
          description: Password found
          schema:
            $ref: '#/definitions/Password'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'

  /history/:
    get:
      tags: [Password History]
      summary: List password history
      description: >-
        Returns the password history entries for the authenticated user, including prior versions and change activity.
        Use the optional query parameters limit and offset to page through results.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          description: Maximum number of history records to return. The server caps this at 100.
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          description: Number of history records to skip before returning the next page.
      responses:
        '200':
          description: History returned
          schema:
            type: array
            items:
              $ref: '#/definitions/PasswordHistory'
          examples:
            application/json:
              - history_id: 7
                user_id: 1
                password_id: 42
                action: update
                details: Password updated by user
                password_name: GitHub
                email: demo@example.com
                username: demoUser
                old_encripted_password: 8f9a6d2c4e7b1a3d
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'

  /history/search=<string:search_name>:
    get:
      tags: [Password History]
      summary: Find password history by name
      description: Searches password history entries by the supplied password name so you can review changes related to a specific entry.
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          type: string
      responses:
        '200':
          description: History found
          schema:
            type: array
            items:
              $ref: '#/definitions/PasswordHistory'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'

  /audit/:
    get:
      tags: [Audit Log]
      summary: List audit logs
      description: >-
        Returns audit log entries for the authenticated user, useful for reviewing account activity.
        Use the optional query parameters limit and offset to page through results.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          type: integer
          default: 50
          description: Maximum number of audit log entries to return. The server caps this at 100.
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
          description: Number of audit log entries to skip before returning the next page.
      responses:
        '200':
          description: Audit logs returned
          schema:
            type: array
            items:
              $ref: '#/definitions/AuditLog'
        '401':
          $ref: '#/responses/UnauthorizedError'

  /security/:
    get:
      tags: [Security Question]
      summary: List security questions
      description: Returns the authenticated user's security questions and their stored answers metadata.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security questions returned
          schema:
            type: array
            items:
              $ref: '#/definitions/SecurityQuestion'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
    post:
      tags: [Security Question]
      summary: Create a security question
      description: Stores a new security question for the authenticated user. Use this when adding a new recovery prompt.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SecurityQuestionCredentials'
      responses:
        '201':
          description: Security question created
          schema:
            $ref: '#/definitions/SecurityQuestion'
          examples:
            application/json:
              question_id: 3
              user_id: 1
              question: What is your favorite pet?
              encripted_answer: 1a2b3c4d5e6f7g8h
        '401':
          $ref: '#/responses/UnauthorizedError'
        '409':
          $ref: '#/responses/ConflictError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    put:
      tags: [Security Question]
      summary: Update a security question
      description: Updates an existing security question for the authenticated user. Send the updated question payload in the request body.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SecurityQuestion'
      responses:
        '201':
          description: Security question updated
          schema:
            $ref: '#/definitions/SecurityQuestion'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '422':
          $ref: '#/responses/UnprocessableEntityError'
        '500':
          $ref: '#/responses/ServerError'
    delete:
      tags: [Security Question]
      summary: Delete a security question
      description: Deletes a security question for the authenticated user. Use this when removing a recovery prompt.
      security:
        - bearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/SecurityQuestion'
      responses:
        '200':
          description: Security question deleted
          schema:
            $ref: '#/definitions/DeleteResponse'
        '401':
          $ref: '#/responses/UnauthorizedError'
        '404':
          $ref: '#/responses/NotFoundError'
        '500':
          $ref: '#/responses/ServerError'
definitions:
  User:
    type: object
    example:
      user_id: 1
      username: demoUser
      first_name: Demo
      last_name: User
      email: demo@example.com
      role: user
      create_date: '2026-08-10T12:00:00Z'
      updated_date: '2026-08-10T12:30:00Z'
    properties:
      user_id:
        type: integer
      username:
        type: string
      password:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      role:
        type: string
      create_date:
        type: string
        format: date-time
      updated_date:
        type: string
        format: date-time
  UserCredentials:
    type: object
    required: [username, password, first_name, last_name, email]
    example:
      username: demoUser
      password: strongPassword123
      first_name: Demo
      last_name: User
      email: demo@example.com
    properties:
      username:
        type: string
      password:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
        format: email
  Role:
    type: object
    required: [role_name]
    example:
      role_id: 2
      role_name: user
    properties:
      role_id:
        type: integer
      role_name:
        type: string
  RoleCredentials:
    type: object
    required: [role_name]
    example:
      role_name: editor
    properties:
      role_name:
        type: string
  Folder:
    type: object
    required: [user_id, folder_name]
    example:
      folder_id: 10
      user_id: 1
      parent_folder_id: null
      folder_name: Work
      created_date: '2026-08-10T12:05:00Z'
    properties:
      folder_id:
        type: integer
      user_id:
        type: integer
      parent_folder_id:
        type: integer
        x-nullable: true
      folder_name:
        type: string
      created_date:
        type: string
        format: date-time
  FolderCredentials:
    type: object
    required: [user_id, folder_name]
    example:
      user_id: 1
      parent_folder_id: null
      folder_name: Work
    properties:
      folder_id:
        type: integer
      user_id:
        type: integer
      parent_folder_id:
        type: integer
        x-nullable: true
      folder_name:
        type: string
  Password:
    type: object
    required: [user_id, email, encripted_password]
    example:
      password_id: 42
      folder_id: 10
      user_id: 1
      password_name: GitHub
      username: demoUser
      email: demo@example.com
      encripted_password: 8f9a6d2c4e7b1a3d
      created_date: '2026-08-10T12:10:00Z'
      last_updated_date: '2026-08-10T12:10:00Z'
    properties:
      password_id:
        type: integer
      folder_id:
        type: integer
        x-nullable: true
      user_id:
        type: integer
      password_name:
        type: string
      username:
        type: string
      email:
        type: string
        format: email
      encripted_password:
        type: string
      created_date:
